name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r relay/requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Start relay for tests
        run: |
          mkdir -p relay/blobs
          RELAY_BASE=$(pwd)/relay python -u relay/relay_server_v2.py > relay/server.log 2>&1 &
          for i in $(seq 1 10); do
            if curl -s http://localhost:8198 >/dev/null 2>&1; then
              echo "✅ Relay ready on :8198 (attempt $i)"
              break
            fi
            sleep 1
          done

      - name: Run relay tests
        run: |
          python -m pytest relay/test_relay_nips.py -v --asyncio-mode=auto --cov=relay --cov-report=term-missing

      - name: Kill relay
        run: |
          pkill -f relay_server_v2.py || true

      - name: Run nostr-sse-client tests (if any)
        run: |
          python -m pytest nostr_sse_client_pkg/ -v || true
